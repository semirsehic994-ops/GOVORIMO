plugins {
    id 'com.android.application'
}

def vp = new Properties()
file('../version.properties').withInputStream { vp.load(it) }

android {
    namespace 'ba.govorimo.app'
    compileSdk 34

    defaultConfig {
        applicationId 'ba.govorimo.app'
        minSdk 24
        targetSdk 34
        versionCode vp['versionCode'].toInteger()
        versionName vp['versionName']
    }

    signingConfigs {
        release {
            // Ključ dolazi iz GitHub Secrets (vidi UPUTE.md). Svaka nova verzija MORA biti potpisana istim ključem.
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'release.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS') ?: 'govorimo'
            keyPassword System.getenv('KEY_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
